name: Deploy malave.com

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FTP_SSH_KEY }}

      - name: Deploy via SSH rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ modern-redesign/ ellis@malave.com:/var/www/html/
      - name: Confirm deployment
        run: echo "✅ Deployment complete to malave.com"
