name: Deploy malave.com

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FTP_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 21098 -H 209.74.67.64 >> ~/.ssh/known_hosts

      - name: Deploy via SSH rsync
        run: |
          # Uploaded media and the SQLite database are owned by the server, not the
          # repository, so protect them from --delete. The uploads .htaccess is
          # re-included so uploads can never execute PHP.
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.opencode' \
            --exclude 'AGENTS.md' \
            --exclude 'README.md' \
            --include 'images/uploads/.htaccess' \
            --include 'images/uploads/.gitkeep' \
            --exclude 'images/uploads/*' \
            -e "ssh -p 21098" \
            ./ malamkte@209.74.67.64:/home/malamkte/public_html/

      - name: Confirm deployment
        run: echo "Deployed to malave.com"
