name: Deploy malave.com

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FTP_SSH_KEY }}

      - name: Add Server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 21098 -H 209.74.67.64 >> ~/.ssh/known_hosts

      - name: Deploy via SSH rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p 21098" \
            ./ modern-redesign/ ellis@209.74.67.64:/home/malamkte/public_html/
      - name: Confirm deployment
        run: echo "✅ Deployment complete to malave.com"
